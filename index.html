<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owl Weather</title>
  <meta name="description" content="Live weather for Boca Raton and anywhere else, powered by Open-Meteo." />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">⛅</span>
      <span class="brand-name">Owl Weather</span>
    </div>
    <div class="theme-switch" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="light" title="Light theme">
        <span aria-hidden="true">☀️</span><span class="label">Light</span>
      </button>
      <button type="button" role="radio" data-theme-choice="dark" title="Dark theme">
        <span aria-hidden="true">🌙</span><span class="label">Dark</span>
      </button>
      <button type="button" role="radio" data-theme-choice="system" title="Match system theme">
        <span aria-hidden="true">💻</span><span class="label">System</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="greeting" aria-live="polite">
      <h1 id="greeting">Hello, Saskia!</h1>
      <p id="greeting-sub" class="muted"></p>
    </section>

    <section class="controls">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <label for="search-input" class="sr-only">Search for a city</label>
        <input id="search-input" type="search" placeholder="Search a city…" />
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </form>
      <div class="control-buttons">
        <button type="button" id="locate-btn" class="btn" title="Use my location">📍<span class="label">My location</span></button>
        <button type="button" id="home-btn" class="btn" title="Back to Boca Raton (FAU)">🦉<span class="label">FAU</span></button>
        <button type="button" id="unit-btn" class="btn" title="Switch units" aria-label="Switch temperature units">°F</button>
      </div>
    </section>

    <p id="status" class="status" role="status" hidden></p>

    <section id="current" class="card current" aria-busy="true">
      <div class="current-main">
        <div>
          <h2 id="place" class="place">Boca Raton, Florida</h2>
          <p id="updated" class="muted small"></p>
        </div>
        <div class="current-temp">
          <span id="current-icon" class="big-icon" aria-hidden="true">—</span>
          <span id="current-temp" class="temp">--°</span>
        </div>
        <p id="current-desc" class="desc">Loading…</p>
        <p id="current-hilo" class="muted"></p>
      </div>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="stat-feels">--</dd></div>
        <div><dt>Humidity</dt><dd id="stat-humidity">--</dd></div>
        <div><dt>Wind</dt><dd id="stat-wind">--</dd></div>
        <div><dt>UV index</dt><dd id="stat-uv">--</dd></div>
        <div><dt>Rain chance</dt><dd id="stat-rain">--</dd></div>
        <div><dt>Sunrise / Sunset</dt><dd id="stat-sun">--</dd></div>
      </dl>
    </section>

    <section class="card">
      <h2 class="section-title">Next 24 hours</h2>
      <div id="hourly" class="hourly" tabindex="0" aria-label="Hourly forecast"></div>
    </section>

    <section class="card">
      <h2 class="section-title">7-day forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>
  </main>

  <footer class="footer muted small">
    Live data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Go Owls! 🦉
  </footer>

  <script src="app.js"></script>
</body>
</html>
